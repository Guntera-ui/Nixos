# ─────────────────────────────────────────
# GENERAL
# ─────────────────────────────────────────

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}


# ─────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────

background {
    monitor =

    # Capture the current desktop when locking
    path = screenshot

    # Dark blurred version of the desktop
    blur_passes = 3
    blur_size = 7

    brightness = 0.55
    contrast = 1.0
    vibrancy = 0.15
}


# ─────────────────────────────────────────
# CLOCK
# ─────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] date +"%H:%M"

    color = rgb(f4f1ff)

    font_size = 62
    font_family = JetBrainsMono Nerd Font

    position = 0, 95

    halign = center
    valign = center
}


# ─────────────────────────────────────────
# DATE
# ─────────────────────────────────────────

label {
    monitor =

    text = cmd[update:60000] date +"%A, %d %B"

    color = rgb(8aadf4)

    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 0, 35

    halign = center
    valign = center
}


# ─────────────────────────────────────────
# PASSWORD
# ─────────────────────────────────────────

input-field {
    monitor =

    size = 300, 48

    # Square, matching the rest of the rice
    rounding = 0

    outline_thickness = 2

    inner_color = rgba(0f1018ee)
    outer_color = rgb(c6a0f6)

    font_color = rgb(f4f1ff)

    check_color = rgb(7dcfe3)
    fail_color = rgb(f29ac3)
    capslock_color = rgb(f29ac3)

    dots_center = true
    dots_size = 0.20
    dots_spacing = 0.30
    dots_rounding = 0

    fade_on_empty = false

    placeholder_text = <span foreground="##878b9f">Password</span>

    fail_text = <span foreground="##f29ac3">$FAIL</span>

    font_family = JetBrainsMono Nerd Font

    position = 0, -55

    halign = center
    valign = center
}
